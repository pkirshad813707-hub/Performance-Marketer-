<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Irshad PK | Digital Marketing</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Geist Font -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:"Geist",sans-serif;
    background:#020202;
    color:#fff;
    overflow:hidden;

}

/* Background */

.background{

    position:fixed;
    inset:0;
    z-index:-2;

    background:
    radial-gradient(circle at 72% 42%,
    rgba(34,105,255,.95) 0%,
    rgba(28,170,255,.8) 18%,
    rgba(0,200,220,.35) 38%,
    rgba(0,0,0,0) 62%),
    #020202;

}

.background::after{

    content:"";
    position:absolute;
    width:900px;
    height:900px;
    border-radius:50%;

    right:-200px;
    top:-180px;

    background:radial-gradient(circle,
    rgba(40,140,255,.45),
    rgba(0,0,0,0));

    filter:blur(100px);

    animation:float 12s ease-in-out infinite alternate;

}

@keyframes float{

    from{
        transform:translateY(-20px);
    }

    to{
        transform:translateY(40px);
    }

}

nav{

    width:100%;
    padding:38px 70px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:absolute;
    top:0;

}

.logo{

    font-size:24px;
    font-weight:800;
    letter-spacing:-1px;

}

nav a{

    color:white;
    text-decoration:none;
    margin-left:40px;
    opacity:.8;
    transition:.3s;

}

nav a:hover{

    opacity:1;

}

.hero{

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

}

.content{

    width:min(1100px,90%);

}

h1{

    font-size:clamp(70px,12vw,170px);

    line-height:.82;
    letter-spacing:-8px;

    margin-bottom:30px;

}

.bold{

    font-weight:900;

}

.light{

    font-weight:300;

}

.description{

    width:640px;
    max-width:100%;

    font-size:22px;
    line-height:1.7;

    color:rgba(255,255,255,.72);

    margin-bottom:50px;

}

.buttons{

    display:flex;
    gap:20px;
    flex-wrap:wrap;

}

.btn{

    text-decoration:none;

    padding:18px 36px;

    border-radius:100px;

    transition:.35s;

    font-size:16px;

}

.primary{

    background:white;
    color:black;

}

.primary:hover{

    transform:translateY(-4px);
    box-shadow:0 0 40px rgba(44,128,255,.4);

}

.secondary{

    border:1px solid rgba(255,255,255,.18);

    color:white;

    backdrop-filter:blur(12px);

}

.secondary:hover{

    background:rgba(255,255,255,.05);

}

.bottom{

    position:absolute;
    left:70px;
    bottom:50px;

    color:rgba(255,255,255,.5);

    font-size:14px;

    letter-spacing:.5px;

}

@media(max-width:768px){

nav{

padding:30px;

}

nav a{

margin-left:20px;

}

h1{

letter-spacing:-4px;

}

.description{

font-size:18px;

}

.bottom{

left:30px;
right:30px;

}

}

</style>

</head>
<body>

<div class="background"></div>

<nav>

<div class="logo">Irshad.</div>

<div>

<a href="https://linkedin.com">LinkedIn</a>

<a href="mailto:hello@irshadpk.in">Email</a>

</div>

</nav>

<section class="hero">

<div class="content">

<h1>

<span class="bold">What's</span><br>

<span class="bold">your</span>

<span class="light">next move?</span>

</h1>

<p class="description">

Helping ambitious technology companies grow through SEO,
AI Search Optimization, Content Strategy and Performance Marketing.

</p>

<div class="buttons">

<a href="mailto:hello@irshadpk.in" class="btn primary">
Let's Talk
</a>

<a href="https://linkedin.com/in/yourprofile" class="btn secondary">
View LinkedIn
</a>

</div>

</div>

</section>

<div class="bottom">

Currently building digital growth strategies at Faircode.

</div>

</body>
</html>
